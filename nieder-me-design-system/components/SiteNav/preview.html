<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../css/work-case-study.css">
<link rel="stylesheet" href="../../css/styleguide.css">
<title>SiteNav</title>
</head>
<body class="policy-page is-subpage design-system-page">
<div class="work-page">
      <nav class="mobile-nav" aria-label="Primary navigation">
        <a class="mobile-nav-anchor" href="../" aria-label="Home">
          <img class="icon-off"   src="../../assets/icons/side-nav/icon-back-off.svg"   alt="" />
          <img class="icon-on"    src="../../assets/icons/side-nav/icon-back-on.svg"    alt="" />
          <img class="icon-hover" src="../../assets/icons/side-nav/icon-back-hover.svg" alt="" />
          <span class="mobile-nav-label">Home</span>
        </a>
        <a class="mobile-nav-anchor" href="../work/" aria-label="Work">
          <img class="icon-off"   src="../../assets/icons/side-nav/icon-work-experience-off.svg"   alt="" />
          <img class="icon-on"    src="../../assets/icons/side-nav/icon-work-experience-on.svg"    alt="" />
          <img class="icon-hover" src="../../assets/icons/side-nav/icon-work-experience-hover.svg" alt="" />
          <span class="mobile-nav-label">Work</span>
        </a>
        <a class="mobile-nav-anchor" href="../about/" aria-label="About &amp; Biography">
          <img class="icon-off"   src="../../assets/icons/side-nav/icon-work-about-off.svg"   alt="" />
          <img class="icon-on"    src="../../assets/icons/side-nav/icon-work-about-on.svg"    alt="" />
          <img class="icon-hover" src="../../assets/icons/side-nav/icon-work-about-hover.svg" alt="" />
          <span class="mobile-nav-label">About</span>
        </a>
        <a class="mobile-nav-anchor" href="../blog/" aria-label="Blog">
          <img class="icon-off"   src="../../assets/icons/side-nav/icon-blog-off.svg" alt="" />
          <img class="icon-on"    src="../../assets/icons/side-nav/icon-blog-on.svg"  alt="" />
          <img class="icon-hover" src="../../assets/icons/side-nav/icon-blog-on.svg"  alt="" />
          <span class="mobile-nav-label">Blog</span>
        </a>
        <a class="mobile-nav-anchor is-active" href="../design-system/" aria-label="Design system">
          <img class="icon-off"   src="../../assets/icons/side-nav/icon-colophon-off.svg"   alt="" />
          <img class="icon-on"    src="../../assets/icons/side-nav/icon-colophon-on.svg"    alt="" />
          <img class="icon-hover" src="../../assets/icons/side-nav/icon-colophon-hover.svg" alt="" />
          <span class="mobile-nav-label">Design</span>
        </a>
        <div class="mobile-nav-toggles">
          <button class="theme-toggle is-off" type="button" aria-pressed="false" aria-label="Switch to light mode">
            <span class="theme-toggle-switch" aria-hidden="true"></span>
            <span class="theme-toggle-label">light</span>
            <span class="theme-toggle-state" aria-live="polite">Off</span>
          </button>
          <div class="theme-toggle-cue theme-toggle-cue-mobile" aria-hidden="true">
            <span class="theme-toggle-cue-text">Light Mode!</span>
            <img class="theme-toggle-cue-arrow" src="../../assets/icons/theme-toggle-cue-arrow.svg" alt="" />
          </div>
          <button class="cols-toggle is-off" type="button" aria-pressed="false" aria-label="Show column grid">
            <span class="cols-toggle-switch" aria-hidden="true"></span>
            <span class="cols-toggle-label">cols</span>
            <span class="cols-toggle-state" aria-live="polite">Off</span>
          </button>
          <div class="theme-toggle-cue cols-toggle-cue-mobile" aria-hidden="true">
            <span class="theme-toggle-cue-text">Column Grid!</span>
            <img class="theme-toggle-cue-arrow" src="../../assets/icons/theme-toggle-cue-arrow.svg" alt="" />
          </div>
        </div>
      </nav>

      <aside class="rail">
        <a class="logo-link" href="../" aria-label="Back to homepage">
          <img class="logo-mark" src="../../assets/icons/logo-mark.svg" alt="JN monogram" />

        <a class="global-nav-anchor" href="../work/" aria-label="Work">

          <img class="icon-hover" src="../../assets/icons/side-nav/icon-work-experience-hover.svg" alt="" />
          <span class="global-nav-popover" aria-hidden="true">Work Experience &amp; Resume</span>
        </a>
        <a class="global-nav-anchor" href="../about/" aria-label="About &amp; Biography">
          <img class="icon-off" src="../../assets/icons/side-nav/icon-work-about-off.svg" alt="" />

          <img class="icon-hover" src="../../assets/icons/side-nav/icon-work-about-hover.svg" alt="" />
          <span class="global-nav-popover" aria-hidden="true">About &amp; Biography</span>
        </a>
        <a class="global-nav-anchor" href="../blog/" aria-label="Blog">
          <img class="icon-off" src="../../assets/icons/side-nav/icon-blog-off.svg" alt="" />
          <img class="icon-on" src="../../assets/icons/side-nav/icon-blog-on.svg" alt="" />
          <img class="icon-hover" src="../../assets/icons/side-nav/icon-blog-on.svg" alt="" />
          <span class="global-nav-popover" aria-hidden="true">Blog</span>
        </a>
        <a class="global-nav-anchor is-active" href="../design-system/" aria-label="Design system">
          <img class="icon-off" src="../../assets/icons/side-nav/icon-colophon-off.svg" alt="" />
          <img class="icon-on" src="../../assets/icons/side-nav/icon-colophon-on.svg" alt="" />
          <img class="icon-hover" src="../../assets/icons/side-nav/icon-colophon-hover.svg" alt="" />
          <span class="global-nav-popover" aria-hidden="true">Design System</span>
        </a>
        <div class="rail-controls-panel">
          <button class="theme-toggle is-off" type="button" aria-pressed="false" aria-label="Switch to light mode">
            <span class="theme-toggle-switch" aria-hidden="true"></span>
            <span class="theme-toggle-label">light</span>
            <span class="theme-toggle-state" aria-live="polite">Off</span>
          </button>
          <div class="theme-toggle-cue theme-toggle-cue-desktop" aria-hidden="true">
            <span class="theme-toggle-cue-text">Light Mode!</span>
            <img class="theme-toggle-cue-arrow" src="../../assets/icons/theme-toggle-cue-arrow.svg" alt="" />
          </div>
          <button class="cols-toggle is-off" type="button" aria-pressed="false" aria-label="Show column grid">
            <span class="cols-toggle-switch" aria-hidden="true"></span>
            <span class="cols-toggle-label">cols</span>
            <span class="cols-toggle-state" aria-live="polite">Off</span>
          </button>
          <div class="theme-toggle-cue cols-toggle-cue-desktop" aria-hidden="true">
            <span class="theme-toggle-cue-text">Column Grid!</span>
            <img class="theme-toggle-cue-arrow" src="../../assets/icons/theme-toggle-cue-arrow.svg" alt="" />
          </div>

</html>
