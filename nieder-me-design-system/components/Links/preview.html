<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../css/work-case-study.css">
<link rel="stylesheet" href="../../css/styleguide.css">
<title>Links</title>
</head>
<body class="policy-page is-subpage design-system-page">
<div class="work-page">
<main class="work-article">
        <section class="styleguide-section" id="actions" aria-labelledby="actions-title">
          <div class="rule"></div>
          <div class="styleguide-section-grid">
            <header class="styleguide-section-head">
              <p class="styleguide-section-index">03</p>
              <h2 id="actions-title">Links</h2>
            </header>

            <div class="styleguide-section-body">
              <p class="styleguide-section-intro">
                Links do most of the work. Buttons are used sparingly, when an action deserves emphasis.
              </p>

              <div class="styleguide-elements-grid">
                <article class="styleguide-element-card styleguide-element-card--button-scale">
                  <p class="styleguide-type-label">Prominent links</p>
                  <div class="styleguide-button-scale">
                    <div class="styleguide-button-scale-copy">
                      <p class="styleguide-promo-cta-eyebrow">Navigation as action</p>
                      <p class="styleguide-promo-cta-note">
                        Use links when the destination changes. Use real buttons only for in-place controls like theme and grid toggles.
                      </p>
                    </div>
                    <div class="styleguide-button-scale-actions">
                      <div class="styleguide-button-specimen">
                        <p class="styleguide-button-specimen-label">Large</p>
                        <a class="case-study-promo-cta styleguide-button-lg" href="../work/resy-discovery/">View Case Study</a>
                      </div>
                      <div class="styleguide-button-specimen">
                        <p class="styleguide-button-specimen-label">Medium</p>
                        <a class="styleguide-button-md" href="../work/">View Work</a>
                      </div>
                    </div>
                  </div>
                </article>
              </div>
            </div>
          </div>
        </section>
</main>
</div>
</body>
</html>
