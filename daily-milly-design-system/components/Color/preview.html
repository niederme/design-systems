<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>preview</title>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<style>body{padding:24px}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.sw div{font-size:15px}.sw i{display:block;height:56px;border-radius:8px;margin-bottom:8px;border:1px solid var(--line)}.sw b{display:block;font-weight:700}.sw span{color:var(--muted)}</style></head>
<body class="dm-root">
<div class="sw">
<div><i style="background:var(--green)"></i><b>green</b><span>#194b37</span></div>
<div data-child="1"><i style="background:var(--child-1)"></i><b>child-1</b><span>#bc3939</span></div>
<div><i style="background:var(--child-2)"></i><b>child-2</b><span>#2860a7</span></div>
<div><i style="background:var(--child-3)"></i><b>child-3</b><span>#7750a5</span></div>
<div><i style="background:var(--ink)"></i><b>ink</b><span>#202923</span></div>
<div><i style="background:var(--text)"></i><b>text</b><span>#474a51</span></div>
<div><i style="background:var(--muted)"></i><b>muted</b><span>#7a8080</span></div>
<div><i style="background:var(--soft)"></i><b>soft</b><span>#f4f6f3</span></div>
<div><i style="background:var(--warn-bg)"></i><b>warn-bg</b><span>#faf5e8</span></div>
<div><i style="background:var(--warn)"></i><b>warn</b><span>#886022</span></div>
<div><i style="background:var(--red)"></i><b>red</b><span>#a84539</span></div>
<div><i style="background:var(--line)"></i><b>line</b><span>#e6e9e6</span></div>
</div>
</body>
</html>
