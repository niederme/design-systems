<!-- @dsCard group="Navigation" height=170 subtitle="System by default, Light or Dark on request" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;padding:24px;background:var(--canvas);} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;} .note{font:400 13px/18px var(--font-sans);color:var(--ink-2);margin:12px 0 0}</style></head>
<body class="aq-root">
<div class="aq-wash" style="padding:24px;border-radius:28px">
<div class="row">
<div class="aq-theme aq-glass" role="group" aria-label="Appearance">
<button type="button" data-mode="system" aria-pressed="true"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg><span>System</span></button>
<button type="button" data-mode="light" aria-pressed="false"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg><span>Light</span></button>
<button type="button" data-mode="dark" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg><span>Dark</span></button>
</div>
<div class="aq-theme aq-theme--compact aq-glass" role="group" aria-label="Appearance">
<button type="button" data-mode="system" aria-pressed="true"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg><span>System</span></button>
<button type="button" data-mode="light" aria-pressed="false"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg><span>Light</span></button>
<button type="button" data-mode="dark" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg><span>Dark</span></button>
</div>
</div>
<p class="note">Labelled for the footer and settings, icon-only for the nav bar. Tap to try it: this preview switches its own theme.</p>
</div>
<script>
  // Preview only: the frame's starting theme stands in for "System".
  var root = document.documentElement, systemTheme = root.getAttribute('data-theme') || 'dark';
  document.querySelectorAll('.aq-theme button').forEach(function (b) {
    b.addEventListener('click', function () {
      var mode = b.dataset.mode;
      root.setAttribute('data-theme', mode === 'system' ? systemTheme : mode);
      document.querySelectorAll('.aq-theme button').forEach(function (o) { o.setAttribute('aria-pressed', String(o.dataset.mode === mode)); });
    });
  });
</script>
</body>
</html>
