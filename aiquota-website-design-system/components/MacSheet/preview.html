<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;padding:24px;background:var(--canvas);} .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;} .col{display:flex;flex-direction:column;gap:16px;} </style></head>
<body class="aq-root">
<div class="aq-sheet" style="max-width:760px">

<div class="aq-sheet__body">

<div class="aq-sheet__services">

<div class="aq-svc"><div class="aq-dial aq-dial--critical" role="img" aria-label="100% of 5h used, 13% of 7d used"><svg viewBox="0 0 124 124" aria-hidden="true"><circle class="aq-dial__track" cx="62.0" cy="62.0" r="58.0" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 62.0 62.0)"/><circle class="aq-dial__track" cx="62.0" cy="62.0" r="48.0" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 62.0 62.0)"/><circle class="aq-dial__fill" cx="62.0" cy="62.0" r="58.0" pathLength="100" stroke-dasharray="75.00 100" transform="rotate(135 62.0 62.0)"/><circle class="aq-dial__fill aq-dial__fill--secondary" cx="62.0" cy="62.0" r="48.0" pathLength="100" stroke-dasharray="9.75 100" transform="rotate(135 62.0 62.0)"/></svg><div class="aq-dial__values" aria-hidden="true"><span>100% 5h</span><span class="is-secondary">13% 7d</span></div></div><div><p class="aq-svc__name">Claude Code</p><p class="aq-svc__plan">Pro plan</p><p class="aq-svc__reset">Resets Thu at 12:00 PM</p><p class="aq-svc__reset">7d resets Wed at 2:00 PM</p></div></div>
</div></div>
<div class="aq-sheet__foot"><span>Settings</span><span>10s ago</span><span>Quit</span></div>
